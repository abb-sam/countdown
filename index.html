<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon-32.png">
  <title>Countdown</title>
  <style>
       h1 { 
       text-align: center;
       font-size: 50px;
      
      }
       .value { font-family: 'Courier New', Courier, monospace; }
       .countdown {
        width: 300px;
        height: 280px;
        background: #ff4d6d;
        clip-path: path("M150,280 C40,190 10,110 10,70 C10,30 60,10 100,40 C130,62 150,90 150,90 C150,90 170,62 200,40 C240,10 290,30 290,70 C290,110 260,190 150,280 Z");
        box-sizing: border-box;
        padding: 110px 50px 90px;  /* pushes content into the fat middle */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
       }
       body {
       margin: 0;
       background-color: #f79faf;
       min-height: 10vh;
       display: flex;
       flex-direction: column;   
       align-items: center;      /* horizontal center */
       justify-content: center;  /* vertical center */
      }
      .monkey {
        position: fixed;
        width: 80px;
        image-rendering: pixelated;
        pointer-events: none;
        z-index: 10;
      }
      .monkey.tl { top: 10px;    left: 10px;  }
      .monkey.tr { top: 10px;    right: 10px; }
      .monkey.bl { bottom: 10px; left: 10px;  }
      .monkey.br { bottom: 10px; right: 10px; }
      @media (max-width: 500px) {
        .monkey {width: 44px};
        .monkey.tl, .monkey.tr {display: none;}
      }
       @keyframes blink { 50% { opacity: 0; } }
       .blink { animation: blink 1s step-end infinite; }

  </style>
</head>
<body>

  <h1>Time until I see you again...</h1>

  <div class="countdown">
    <div class="unit">
      <span class="value" id="days">--</span>
      <span class="label">days</span>
    </div>
    <div class="unit">
      <span class="value" id="hours">--</span>
      <span class="label">hours</span>
    </div>
    <div class="unit">
      <span class="value" id="minutes">--</span>
      <span class="label">minutes</span>
    </div>
    <div class="unit">
      <span class="value" id="seconds">--</span>
      <span class="label">seconds</span>
    </div>
  </div>

  <img class="monkey tl" src="monkeypls.gif" alt="">
  <img class="monkey tr" src="monkeypls.gif" alt="">
  <img class="monkey bl" src="monkeypls.gif" alt="">
  <img class="monkey br" src="monkeypls.gif" alt="">

  <script>
    // Set date here, Format: "YYYY-MM-DDTHH:MM:SS"
    const target = new Date("2026-09-11T21:00:00-04:00"); 

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    function update() {
      const now = new Date();
      const gap = target - now; // milliseconds remaining

      if (gap <= 0) {
        document.querySelector(".countdown").textContent = "It's timeeeeee!!!! 🎉🎉🎉🎉🎉🎉";
      } else {
        const totalSeconds = gap / 1000;
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = Math.floor(totalSeconds % 60);

        daysEl.textContent = days;
        hoursEl.textContent = hours;
        minutesEl.textContent = minutes;
        secondsEl.textContent = seconds;
      }
    }

    update();                  // run once now so it doesn't start on dashes
    setInterval(update, 1000); // then tick every second
  </script>

</body>
</html>
